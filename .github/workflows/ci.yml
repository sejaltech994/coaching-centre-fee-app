# Quality gates for every change. Each job is a required status check on
# develop, sit, uat and main, so a PR cannot merge unless all of them pass.
# "E2E" runs the Playwright suite from sejaltech994/coaching-centre-fee-app-e2e
# against this change's own API and web build.
# deploy.yml calls this same workflow before it deploys anything.
# See docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [develop, sit, uat, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Runs every workspace's tests. Each fails when its lines, statements,
      # functions or branches drop below its vitest.config.mts thresholds (80%).
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const rows = ["apps/web", "apps/api", "packages/shared", "packages/content", "packages/db", "packages/integrations"]
              .filter((dir) => fs.existsSync(`${dir}/coverage/coverage-summary.json`))
              .map((dir) => {
                const t = require(`./${dir}/coverage/coverage-summary.json`).total;
                return `| ${dir} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |`;
              });
            console.log(["### Coverage (minimum 80% each)", "", "| Workspace | Lines | Statements | Functions | Branches |",
              "| --- | --- | --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w apps/web

  dependency-review:
    name: Dependency review
    # Compares the PR's dependencies with its base branch; nothing to compare on a deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Blocks new dependencies with known high or critical vulnerabilities,
      # or with licences that would restrict selling the product.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the matching browser, so no slow system-package install.
    # Keep the tag equal to @playwright/test in the e2e repo.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:8787/api/v1
      OTP_LOG_FILE: /tmp/chukta-api.log
    steps:
      - uses: actions/checkout@v7
      # A same-named branch in the e2e repo (e.g. feature/batches) carries this
      # change's new scenarios; otherwise the suite on main is used.
      - name: Pick the e2e branch
        id: e2e-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/sejaltech994/coaching-centre-fee-app-e2e "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: sejaltech994/coaching-centre-fee-app-e2e
          ref: ${{ steps.e2e-ref.outputs.ref }}
          path: e2e
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install and build the app
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_GOOGLE_SIGN_IN: "on"
        run: |
          npm ci
          npm run build -w apps/web

      - name: Start the API (embedded database, console SMS, fake Google)
        working-directory: apps/api
        env:
          NODE_ENV: development
          PORT: "8787"
          DATABASE_URL: pglite:memory
          JWT_SECRET: e2e-only-secret-not-used-anywhere-else-0123456789
          SMS_PROVIDER: console
          WEB_ORIGINS: ${{ env.WEB_URL }}
          # Every scenario logs in from the same IP; the TSD's 10/hour would cap the suite.
          OTP_PER_IP_PER_HOUR: "1000"
          # The API's own account chooser in place of Google (refused in production).
          GOOGLE_PROVIDER: fake
        run: nohup npx tsx src/server.ts > "$OTP_LOG_FILE" 2>&1 &

      - name: Serve the web build
        run: nohup node scripts/serve-static.mjs apps/web/out 3000 > /tmp/chukta-web.log 2>&1 &

      - name: Wait for both
        run: |
          node -e '
            const wait = async (url) => {
              for (let i = 0; i < 60; i++) {
                try { if ((await fetch(url)).ok) return; } catch {}
                await new Promise((r) => setTimeout(r, 1000));
              }
              console.error(`Timed out waiting for ${url}`);
              process.exit(1);
            };
            (async () => { for (const url of process.argv.slice(1)) await wait(url); })();
          ' "$API_URL/health" "$WEB_URL/"

      - name: Run the end-to-end suite
        working-directory: e2e
        run: |
          npm ci
          npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            /tmp/chukta-api.log
            /tmp/chukta-web.log
          retention-days: 14
          if-no-files-found: ignore
