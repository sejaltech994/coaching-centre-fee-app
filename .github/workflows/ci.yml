# Quality gates for every change. Each job is a required status check on
# develop, sit, uat and main, so a PR cannot merge unless all of them pass.
# deploy.yml calls this same workflow before it deploys anything.
# See docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [develop, sit, uat, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Runs every workspace's tests. Each fails when its lines, statements,
      # functions or branches drop below its vitest.config.mts thresholds (80%).
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const rows = ["apps/web", "apps/api", "packages/shared", "packages/db", "packages/integrations"]
              .filter((dir) => fs.existsSync(`${dir}/coverage/coverage-summary.json`))
              .map((dir) => {
                const t = require(`./${dir}/coverage/coverage-summary.json`).total;
                return `| ${dir} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |`;
              });
            console.log(["### Coverage (minimum 80% each)", "", "| Workspace | Lines | Statements | Functions | Branches |",
              "| --- | --- | --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w apps/web

  dependency-review:
    name: Dependency review
    # Compares the PR's dependencies with its base branch; nothing to compare on a deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Blocks new dependencies with known high or critical vulnerabilities,
      # or with licences that would restrict selling the product.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0
