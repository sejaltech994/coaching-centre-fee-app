# Publishes each environment branch to its environment after code lands on it.
# The web app goes to Cloudflare Workers (static assets), one Worker per env.
# Needs the repository secret CLOUDFLARE_API_TOKEN; the account ID is in
# apps/web/wrangler.jsonc. See docs/deployment.md.
name: Deploy

on:
  push:
    branches: [develop, sit, uat, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

      # Keep dev, sit and uat out of search engines.
      - name: Mark non-prod as noindex
        if: env.DEPLOY_ENV != 'prod'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> out/_headers

      - name: Deploy web to Cloudflare
        id: deploy
        # bash -eo pipefail, so a failed deploy is not hidden by the pipe into tee.
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. See docs/deployment.md."
            exit 0
          fi
          npx wrangler deploy --env "$DEPLOY_ENV" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $DEPLOY_ENV to $url"
