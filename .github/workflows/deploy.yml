# Publishes each environment branch to its environment after code lands on it.
# Deploy targets and secrets live in GitHub Environments (dev, sit, uat, prod).
name: Deploy

on:
  push:
    branches: [develop, sit, uat, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      # TODO: replace with the real deploy once hosting is chosen (for example
      # Vercel, or a Docker image pushed to a registry). Read targets and keys
      # from this environment's secrets, e.g. ${{ secrets.DEPLOY_TOKEN }}.
      - name: Deploy
        run: echo "::notice::No hosting target configured yet; built ${{ github.sha }} for $GITHUB_REF_NAME."
