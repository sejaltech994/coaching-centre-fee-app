# Static security analysis of the TypeScript code. Findings appear under
# Security › Code scanning; "CodeQL" is a required check on every PR.
name: CodeQL

on:
  pull_request:
    branches: [develop, sit, uat, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC, to catch newly published queries

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
